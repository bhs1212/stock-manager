<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>버거킹 재고관리</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body {
        background-color: #f4f1ea;
      }
      .navbar {
        background-color: #da291c;
      }
      .btn-king {
        background-color: #ffbc0d;
        color: #502314;
        font-weight: bold;
      }
      .btn-king:hover {
        background-color: #e6a900;
      }
      .low-stock {
        color: #da291c;
        font-weight: bold;
        background-color: #ffeaea;
      }
      .out-of-stock {
        color: red;
        font-weight: bold;
      }
      .expire-danger {
        background-color: #f8d7da !important;
      }
      .expire-warning {
        background-color: #fff3cd !important;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand" href="/inventory"
          >🍔 BURGER KING Stock Manager</a
        >
        <div class="navbar-nav ms-auto align-items-center">
          <span
            sec:authorize="isAuthenticated()"
            class="navbar-text me-3 text-white"
          >
            <strong sec:authentication="principal.username"></strong> 님 접속 중
          </span>
          <a
            sec:authorize="isAuthenticated()"
            class="btn btn-outline-light btn-sm"
            href="/logout"
            >로그아웃</a
          >
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="mb-4">
        <button
          type="button"
          class="btn btn-king"
          data-bs-toggle="modal"
          data-bs-target="#salesModal"
        >
          🍔 메뉴 판매 처리
        </button>
        <a href="/sales-dashboard" class="btn btn-king"> 📊 판매 내역 보기 </a>
      </div>

      <div sec:authorize="hasRole('ADMIN')" class="card shadow-sm mb-4">
        <div class="card-header btn-king">신규 자재 등록</div>
        <div class="card-body">
          <form th:action="@{/add-stock}" method="post" class="row g-3">
            <div class="col-md-3">
              <input
                type="text"
                name="itemName"
                class="form-control"
                placeholder="자재명"
                required
              />
            </div>
            <div class="col-md-2">
              <input
                type="number"
                name="quantity"
                class="form-control"
                placeholder="수량"
                required
              />
            </div>
            <div class="col-md-2">
              <select name="unit" class="form-select" required>
                <option value="" disabled selected>단위를 선택하세요</option>
                <option value="KG">KG (킬로그램)</option>
                <option value="EA">EA (개수)</option>
                <option value="PACK">PACK (팩)</option>
                <option value="BOX">BOX (박스)</option>
                <option value="L">L (리터)</option>
              </select>
            </div>
            <div class="col-md-3">
              <input
                type="date"
                name="expirationDate"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-king w-100">등록</button>
            </div>
          </form>
        </div>
      </div>

      <div class="card shadow-sm">
        <div class="card-body">
          <div class="mb-3">
            <form th:action="@{/inventory}" method="get" class="d-flex">
              <input
                type="text"
                name="keyword"
                class="form-control me-2"
                placeholder="자재 이름으로 검색"
                th:value="${keyword}"
              />
              <button type="submit" class="btn btn-dark">검색</button>
              <a href="/inventory" class="btn btn-outline-secondary ms-2"
                >초기화</a
              >
            </form>
          </div>
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>자재명</th>
                <th>수량(변경)</th>
                <th>단위</th>
                <th>유통기한</th>
                <th>관리</th>
              </tr>
            </thead>
            <tbody>
              <tr
                th:each="item : ${stocks}"
                th:classappend="${(item.quantity < 10 ? 'low-stock' : '') + ' ' + (item.daysUntilExpiration < 0 ? 'expire-danger' : (item.daysUntilExpiration <= 3 ? 'expire-warning' : ''))}"
              >
                <td>
                  <strong th:text="${item.itemName}"></strong>
                  <span
                    th:if="${item.daysUntilExpiration < 0}"
                    class="badge bg-danger"
                    >폐기대상</span
                  >
                  <span
                    th:if="${item.daysUntilExpiration >= 0 and item.daysUntilExpiration <= 3}"
                    class="badge bg-warning text-dark"
                    th:text="'임박(' + ${item.daysUntilExpiration} + '일)'"
                  ></span>
                </td>
                <td>
                  <form
                    sec:authorize="hasRole('ADMIN')"
                    th:action="@{/update-stock}"
                    method="post"
                    class="d-flex align-items-center"
                    onsubmit="return confirm('수량을 변경하시겠습니까?');"
                  >
                    <input type="hidden" name="id" th:value="${item.id}" />
                    <input
                      type="number"
                      name="quantity"
                      th:value="${item.quantity}"
                      min="0"
                      class="form-control form-control-sm me-2"
                      th:classappend="${item.quantity == 0 ? 'bg-danger-subtle text-danger fw-bold' : ''}"
                      style="width: 70px"
                    />
                    <button
                      type="submit"
                      class="btn btn-sm btn-outline-secondary"
                    >
                      변경
                    </button>
                  </form>
                  <span
                    sec:authorize="!hasRole('ADMIN')"
                    th:classappend="${item.quantity == 0 ? 'text-danger fw-bold' : ''}"
                    th:text="${item.quantity}"
                  ></span>
                </td>
                <td th:text="${item.quantity + ' ' + item.unit}"></td>
                <td th:text="${item.expirationDate}"></td>
                <td>
                  <form
                    sec:authorize="hasRole('ADMIN')"
                    th:action="@{/delete-stock}"
                    method="post"
                    style="display: inline"
                  >
                    <input type="hidden" name="id" th:value="${item.id}" />
                    <button
                      type="submit"
                      class="btn btn-danger btn-sm"
                      onclick="return confirm('정말 삭제하시겠습니까?');"
                    >
                      삭제
                    </button>
                  </form>
                  <span
                    sec:authorize="!hasRole('ADMIN')"
                    class="text-muted small"
                    >조회 전용</span
                  >
                </td>
              </tr>
            </tbody>
          </table>
          <div class="d-flex justify-content-center mt-4">
            <nav>
              <ul class="pagination">
                <li
                  class="page-item"
                  th:classappend="${currentPage == 1 ? 'disabled' : ''}"
                >
                  <a
                    class="page-link"
                    th:href="@{/inventory(page=${currentPage - 1}, keyword=${keyword})}"
                    >이전</a
                  >
                </li>
                <li
                  th:each="i : ${#numbers.sequence(1, totalPages)}"
                  class="page-item"
                  th:classappend="${currentPage == i ? 'active' : ''}"
                >
                  <a
                    class="page-link"
                    th:href="@{/inventory(page=${i}, keyword=${keyword})}"
                    th:text="${i}"
                  ></a>
                </li>
                <li
                  class="page-item"
                  th:classappend="${currentPage == totalPages ? 'disabled' : ''}"
                >
                  <a
                    class="page-link"
                    th:href="@{/inventory(page=${currentPage + 1}, keyword=${keyword})}"
                    >다음</a
                  >
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <div
      class="modal fade"
      id="salesModal"
      tabindex="-1"
      aria-labelledby="salesModalLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <div
            class="modal-header"
            style="background-color: #da291c; color: white"
          >
            <h5 class="modal-title" id="salesModalLabel">
              🍔 메뉴 판매 (재고 자동 차감)
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <form th:action="@{/sell-menu}" method="post">
            <div class="modal-body">
              <div class="mb-3">
                <label class="form-label fw-bold">메뉴 선택</label>
                <select name="menuName" class="form-select" required>
                  <option value="" disabled selected>
                    판매할 메뉴를 선택하세요
                  </option>
                  <option value="불고기버거">불고기버거</option>
                  <option value="치즈버거">치즈버거</option>
                  <option value="와퍼">와퍼</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">판매 수량</label>
                <div class="input-group">
                  <input
                    type="number"
                    name="sellCount"
                    class="form-control"
                    min="1"
                    value="1"
                    required
                  />
                  <span class="input-group-text">개</span>
                </div>
              </div>
              <div class="alert alert-info small">
                * 판매 시 레시피에 등록된 재료 재고가 자동으로 차감됩니다.
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                취소
              </button>
              <button type="submit" class="btn btn-king">판매 확정</button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <span
      id="successMsg"
      style="display: none"
      th:if="${message}"
      th:text="${message}"
    ></span>
    <span
      id="errorMsg"
      style="display: none"
      th:if="${error}"
      th:text="${error}"
    ></span>
    <script>
      var successEl = document.getElementById("successMsg");
      if (successEl) alert(successEl.textContent);

      var errorEl = document.getElementById("errorMsg");
      if (errorEl) alert(errorEl.textContent);
    </script>
  </body>
</html>
