<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <head>
    <meta charset="UTF-8" />
    <title>버거킹 판매 대시보드</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        background-color: #f4f1ea;
      }
      .navbar {
        background-color: #da291c;
      }
      .btn-king {
        background-color: #ffbc0d;
        color: #502314;
        font-weight: bold;
      }
      .card-header {
        background-color: #502314;
        color: white;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm mb-4">
      <div class="container">
        <a class="navbar-brand" href="/inventory"
          >🍔 BURGER KING Sales Dashboard</a
        >
        <div class="navbar-nav ms-auto">
          <a class="btn btn-outline-light btn-sm" href="/inventory"
            >재고 목록으로 돌아가기</a
          >
        </div>
      </div>
    </nav>

    <div class="container">
      <div class="card shadow-sm mb-4">
        <div class="card-header">📈 판매 통계</div>
        <div class="card-body">
          <ul class="nav nav-tabs mb-3" id="statTab">
            <li class="nav-item">
              <a class="nav-link active" data-bs-toggle="tab" href="#daily"
                >오늘</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#weekly"
                >이번 주</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#monthly"
                >이번 달</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" data-bs-toggle="tab" href="#custom"
                >월별 조회</a
              >
            </li>
          </ul>

          <div class="tab-content">
            <!-- 오늘 -->
            <div class="tab-pane fade show active" id="daily">
              <table class="table table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>메뉴</th>
                    <th>판매량</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="stat : ${dailyStats}">
                    <td th:text="${stat.menuName}"></td>
                    <td>
                      <strong th:text="${stat.totalCount} + '개'"></strong>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(dailyStats)}">
                    <td colspan="2" class="text-center text-muted">
                      오늘 판매 내역이 없습니다.
                    </td>
                  </tr>
                </tbody>
              </table>
              <canvas id="dailyChart" height="100"></canvas>
            </div>

            <!-- 이번 주 -->
            <div class="tab-pane fade" id="weekly">
              <table class="table table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>메뉴</th>
                    <th>판매량</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="stat : ${weeklyStats}">
                    <td th:text="${stat.menuName}"></td>
                    <td>
                      <strong th:text="${stat.totalCount} + '개'"></strong>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(weeklyStats)}">
                    <td colspan="2" class="text-center text-muted">
                      이번 주 판매 내역이 없습니다.
                    </td>
                  </tr>
                </tbody>
              </table>
              <canvas id="weeklyChart" height="100"></canvas>
            </div>

            <!-- 이번 달 -->
            <div class="tab-pane fade" id="monthly">
              <table class="table table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>메뉴</th>
                    <th>판매량</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="stat : ${monthlyStats}">
                    <td th:text="${stat.menuName}"></td>
                    <td>
                      <strong th:text="${stat.totalCount} + '개'"></strong>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(monthlyStats)}">
                    <td colspan="2" class="text-center text-muted">
                      이번 달 판매 내역이 없습니다.
                    </td>
                  </tr>
                </tbody>
              </table>
              <canvas id="monthlyChart" height="100"></canvas>
            </div>

            <!-- 월별 조회 -->
            <div class="tab-pane fade" id="custom">
              <form
                th:action="@{/sales-dashboard}"
                method="get"
                class="d-flex align-items-center gap-2 mb-3"
              >
                <select name="year" class="form-select" style="width: 110px">
                  <option value="2024" th:selected="${selectedYear == 2024}">
                    2024년
                  </option>
                  <option value="2025" th:selected="${selectedYear == 2025}">
                    2025년
                  </option>
                  <option value="2026" th:selected="${selectedYear == 2026}">
                    2026년
                  </option>
                </select>
                <select name="month" class="form-select" style="width: 100px">
                  <option
                    th:each="m : ${#numbers.sequence(1, 12)}"
                    th:value="${m}"
                    th:text="${m} + '월'"
                    th:selected="${selectedMonth == m}"
                  ></option>
                </select>
                <button type="submit" class="btn btn-king">조회</button>
              </form>

              <table class="table table-bordered">
                <thead class="table-light">
                  <tr>
                    <th>메뉴</th>
                    <th>판매량</th>
                  </tr>
                </thead>
                <tbody>
                  <tr th:each="stat : ${customStats}">
                    <td th:text="${stat.menuName}"></td>
                    <td>
                      <strong th:text="${stat.totalCount} + '개'"></strong>
                    </td>
                  </tr>
                  <tr th:if="${#lists.isEmpty(customStats)}">
                    <td
                      colspan="2"
                      class="text-center text-muted"
                      th:text="${selectedYear} + '년 ' + ${selectedMonth} + '월 판매 내역이 없습니다.'"
                    ></td>
                  </tr>
                </tbody>
              </table>
              <canvas id="customChart" height="100"></canvas>
            </div>
          </div>
        </div>
      </div>

      <div class="card shadow-sm">
        <div
          class="card-header d-flex justify-content-between align-items-center"
        >
          <span>📋 최근 판매 내역 (최신순)</span>
          <span
            class="badge bg-light text-dark"
            th:text="'총 ' + ${#lists.size(salesLogs)} + '건'"
          ></span>
        </div>
        <div class="card-body">
          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>번호</th>
                <th>메뉴명</th>
                <th>판매 수량</th>
                <th>판매 일시</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="log : ${salesLogs}">
                <td th:text="${log.id}"></td>
                <td><strong th:text="${log.menuName}"></strong></td>
                <td>
                  <span
                    class="badge bg-primary"
                    th:text="${log.sellCount} + '개'"
                  ></span>
                </td>
                <td
                  th:text="${#temporals.format(log.saleDate, 'yyyy-MM-dd HH:mm:ss')}"
                ></td>
              </tr>
              <tr th:if="${#lists.isEmpty(salesLogs)}">
                <td colspan="4" class="text-center py-5 text-muted">
                  아직 판매 내역이 없습니다. 🍔 메뉴를 먼저 판매해 보세요!
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.has("year") || urlParams.has("month")) {
        const customTab = document.querySelector('a[href="#custom"]');
        if (customTab) {
          new bootstrap.Tab(customTab).show();
        }
      }
    </script>
    <script th:inline="javascript">
      const dailyStats = /*[[${dailyStatsJson}]]*/ "[]";
      const weeklyStats = /*[[${weeklyStatsJson}]]*/ "[]";
      const monthlyStats = /*[[${monthlyStatsJson}]]*/ "[]";
      const customStats = /*[[${customStatsJson}]]*/ "[]";

      function createChart(canvasId, data, label) {
        const parsed = typeof data === "string" ? JSON.parse(data) : data;
        const ctx = document.getElementById(canvasId).getContext("2d");
        new Chart(ctx, {
          type: "bar",
          data: {
            labels: parsed.map((item) => item.menuName),
            datasets: [
              {
                label: label,
                data: parsed.map((item) => item.totalCount),
                backgroundColor: [
                  "#da291c",
                  "#ffbc0d",
                  "#502314",
                  "#ff6b35",
                  "#2e86de",
                ],
                borderRadius: 6,
              },
            ],
          },
          options: {
            responsive: true,
            plugins: {
              legend: { display: false },
            },
            scales: {
              y: {
                beginAtZero: true,
                ticks: { stepSize: 1 },
              },
            },
          },
        });
      }

      createChart("dailyChart", dailyStats, "오늘 판매량");
      createChart("weeklyChart", weeklyStats, "이번 주 판매량");
      createChart("monthlyChart", monthlyStats, "이번 달 판매량");
      createChart("customChart", customStats, "월별 판매량");
    </script>
  </body>
</html>
